name: 유튜브 영상 목록 자동 갱신

on:
  schedule:
    - cron: '7 21 * * *'   # 매일 06:07 (한국 시간)
    - cron: '7 9 * * *'    # 매일 18:07 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 새 영상 확인 및 페이지 생성
        run: python3 scripts/videos.py
      - name: 바뀐 내용 저장
        id: commit
        run: |
          git config user.name "npconsulting-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json videos.html index.html sitemap.xml
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "유튜브 새 영상 자동 반영"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 홈페이지 다시 배포
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
